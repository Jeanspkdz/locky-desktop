<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Bloqueo activado</title><link rel="stylesheet" href="./styles.css"></head>
<body class="lock-screen">
  <main class="lock-content">
    <div class="lock-brand" aria-label="Escudo de Locky"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 5 39 10v12c0 10-6 17-15 21C15 39 9 32 9 22V10L24 5Z"/><path d="M24 16v14m-4-9a4 4 0 1 1 8 0c0 2-1 3-4 4"/></svg><span>LOCKY</span></div>
    <p class="lock-eyebrow">LOCKY DESKTOP</p>
    <h1>Se activó el bloqueo</h1>
    <p class="lock-description">Los navegadores están bloqueados temporalmente.</p>
    <div class="timer-frame"><div class="timer-ring"><output id="remaining-time" aria-live="off">07:00</output><span>TIEMPO RESTANTE</span></div></div>
    <div class="blocked-browsers" aria-label="Navegadores bloqueados"><span><strong>Chrome</strong> Bloqueado</span><span><strong>Edge</strong> Bloqueado</span><span><strong>Brave</strong> Bloqueado</span></div>
    <p class="lock-footer">Las demás aplicaciones siguen disponibles.</p>
  </main>
  <script src="./lock.js"></script>
</body></html>
